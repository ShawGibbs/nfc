<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blank template – Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="../assets/card-designs.css">
</head>
<body data-firm="shaw-gibbs" class="contact-card">
<div class="design-frame">
<div class="template-controls">
    <div>
        <label for="template-view">Preview layout</label>
        <select id="template-view">
            <option value="original" selected>Original</option>
            <option value="editorial">Editorial</option>
            <option value="split">Split portrait</option>
            <option value="signature">Signature</option>
            <option value="direct">Contact first</option>
        </select>
    </div>
    <div>
        <label for="template-firm">Firm</label>
        <select id="template-firm">
            <option value="shaw-gibbs" data-logo="../assets/sg-logo.svg" selected>Shaw Gibbs</option>
            <option value="alliotts" data-logo="../assets/alliotts-logo.svg">Alliotts LLP</option>
        </select>
    </div>
    <p>Published cards use <strong>Original</strong>.</p>
    <a href="../">Contact directory</a>
</div>
<main class="card">
    <header class="profile-hero">
        <div class="hero-text">
            <img src="../assets/sg-logo.svg" alt="Shaw Gibbs" class="firm-logo">
            <h1 class="profile-name">[Name]</h1>
            <p class="profile-title">[Job title]</p>
        </div>
        <span class="portrait-fallback" aria-hidden="true">Photo</span>
    </header>
    <div class="card-body">
        <div class="section">
            <div class="label">Email</div>
            <span class="placeholder">[Email address]</span>
        </div>
        <div class="section">
            <div class="label">Telephone</div>
            <span class="placeholder">[Telephone number]</span>
        </div>
        <div class="section">
            <div class="label">Online</div>
            <span class="placeholder">[Profile or website]</span>
        </div>
        <div class="section">
            <div class="label">Office</div>
            <span class="placeholder">[Office address]</span>
        </div>
        <div class="button-row">
            <span class="btn primary">Save contact</span>
            <span class="btn">View profile</span>
        </div>
    </div>
</main>
</div>
<script src="../assets/template-preview.js" defer></script>
</body>
</html>
