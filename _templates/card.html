<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>$page_title – Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="${assets}style.css">
$extra_styles</head>
<body data-firm="$firm" class="$classes">
$frame_start
<main class="card">
    <header class="profile-hero">
        <div class="hero-text">
            $logo
            <h1 class="profile-name">$name</h1>
            <p class="profile-title">$role</p>
        </div>
        $portrait
    </header>
    <div class="card-body">
$card_body
    </div>
</main>
$navigation
$frame_end
$scripts</body>
</html>
