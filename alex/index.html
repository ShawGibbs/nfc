<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alex Poynor – Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="../assets/card-designs.css">
</head>
<body data-firm="alliotts" class="contact-card">


<main class="card">
    <header class="profile-hero">
        <div class="hero-text">
            <img src="../assets/alliotts-logo.svg" alt="Alliotts LLP" class="firm-logo">
            <h1 class="profile-name">Alex Poynor</h1>
            <p class="profile-title">Director, Audit &amp; Assurance</p>
        </div>
        <img src="https://www.alliotts.com/wp-content/uploads/2023/03/Alex-P_Profile.jpg" class="profile-photo" alt="" width="220" height="220" hidden>
        <span class="portrait-fallback" aria-hidden="true">AP</span>
    </header>
    <div class="card-body">
        <div class="section">
            <div class="label">Email</div>
            <a href="mailto:alexander.poynor@alliotts.com">alexander.poynor@alliotts.com</a>
        </div>
        <div class="button-row">
            <a href="contact.vcf" class="btn primary" download>Save contact</a>
            <a href="https://www.alliotts.com/people/alex-poynor/" class="btn">View profile</a>
        </div>
    </div>
</main>

<script src="../assets/card-portrait.js" defer></script>
<script src="../assets/scripts.js"></script>
</body>
</html>
