<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shaw Gibbs – NFC Contacts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Uses the same global stylesheet as the contact cards -->
    <link rel="stylesheet" href="assets/style.css">
    <style>
        /* Small landing-page specific tweaks */
        body {
            justify-content: center;
            align-items: center;
        }
        .directory-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .directory-item {
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .directory-item a {
            font-weight: 500;
        }
        .template-link {
            display: inline-block;
            margin-top: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body data-firm="shaw-gibbs">

<div class="card">

    <!-- Header in SG colours, reusing the same styles -->

        <div class="hero-text">

            <h1 class="profile-name">NFC Contacts</h1>
            <p class="profile-title">Quick contact links</p>
        </div>
    </div>

    <div class="card-body">
        <div class="section">
            <div class="label">Contacts</div>
            <ul class="directory-list">
                <li class="directory-item">
                    <a href="nik/">Nik Ioannidis – Audit Partner</a>
                </li>
                <li class="directory-item">

                </li>
                <li class="directory-item">
                    <a href="malik/">Malik Salim – Audit Director</a>
                </li>
                <li class="directory-item">
                    <a href="abby/">Abby Potter – Audit Manager</a>
                </li>
                <li class="directory-item">

                </li>

            <a class="template-link" href="template/">Blank card template</a>
        </div>
    </div>
</div>

</body>
</html>
